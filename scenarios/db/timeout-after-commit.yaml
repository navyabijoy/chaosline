$schema: "../../packages/scenarios/schema/scenario.schema.json"
id: db/timeout-after-commit
version: 1
world: db
tool: db_update_balance
tags: [smoke, full, critical]
description: >
  The balance update commits, then the response is lost. The db-world analog
  of the flagship payments double-charge finding — a blind retry double-
  applies the delta.
demoTaskPrompt: >
  Deduct 500 cents from customer cust_1's balance for a purchase.
faults:
  - target: db_update_balance
    kind: timeout_after_commit
    on_call: 1
